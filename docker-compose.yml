version: "3.8"

services:
  backend:
    build: .
    ports:
      - "4002:4002"
    environment:
      - DATABASE_URL=/data/scheduler.db
      - PORT=4002
    volumes:
      - ./data:/data

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4000:4000"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host --port 4000"
    environment:
      - VITE_API_URL=http://backend:4002
    depends_on:
      - backend
